<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../JavaScript/errorReporter.js"></script>
    <title>Systems Map — Endless Sky Nexus</title>
    <meta name="description" content="An interactive Endless Sky galaxy map: systems, planets, governments, jump links, trade runs, story events over time and what your own pilot has seen.">
    <link rel="canonical" href="https://endless-sky-nexus.ravenslittlesis.workers.dev/Display/HTML/Systems.html">
    <meta name="theme-color" content="#0f172a">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="../Images/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../Images/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="../Images/apple-touch-icon.png">
    <meta property="og:site_name" content="Endless Sky Nexus">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Systems Map — Endless Sky Nexus">
    <meta property="og:description" content="An interactive Endless Sky galaxy map: systems, planets, governments, jump links, trade runs, story events over time and what your own pilot has seen.">
    <meta property="og:url" content="https://endless-sky-nexus.ravenslittlesis.workers.dev/Display/HTML/Systems.html">
    <meta property="og:image" content="https://endless-sky-nexus.ravenslittlesis.workers.dev/Display/Images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Endless Sky Nexus — tools for Endless Sky">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Systems Map — Endless Sky Nexus">
    <meta name="twitter:description" content="An interactive Endless Sky galaxy map: systems, planets, governments, jump links, trade runs, story events over time and what your own pilot has seen.">
    <meta name="twitter:image" content="https://endless-sky-nexus.ravenslittlesis.workers.dev/Display/Images/og-image.png">
    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="stylesheet" href="../CSS/mapView.css">
</head>
<body>
    <noscript><p style="padding:16px;max-width:900px;margin:0 auto;">Endless Sky Nexus needs JavaScript for its interactive tools. An interactive Endless Sky galaxy map: systems, planets, governments, jump links, trade runs, story events over time and what your own pilot has seen.</p></noscript>

    <div id="navbar-mount" data-src="NavBar.html"></div>
    <script src="../JavaScript/navLoader.js"></script>

    <div class="container">

        <header class="panel map-header-row">
            <div>
                <h1>🌌 Systems Map</h1>
                <p class="subtitle" id="mapSubtitle">Loading…</p>
            </div>

            <div>
                <button class="btn-action" onclick="openPluginPicker()">
                    ☰ Select Plugins
                </button>
            </div>
        </header>

        <!-- Active plugins — same shared component every data page uses -->
        <div class="panel" style="margin-top:16px;">
            <h2 class="section-title" id="pluginSelectorTitle">Active Plugins</h2>
            <div id="activePluginList">
                <span class="sorter-empty">Loading plugins…</span>
            </div>
        </div>

        <!-- Map viewport -->
        <div class="map-viewport" id="mapWrap" style="margin-top:16px;">
            <canvas id="mapCanvas"></canvas>

            <div class="map-search">
                <input id="mapSearchInput" type="text" placeholder="Search systems…" autocomplete="off">
                <div class="map-search-results" id="mapSearchResults"></div>
                <button class="btn btn-secondary btn-sm map-share-btn" type="button" onclick="shareMapLocation()" title="Copy a link that opens the map on the selected system (and planet)">🔗 Share selected system</button>
            </div>

            <div class="map-legend">
                <div class="map-layers">
                    <h2>Layers</h2>
                    <label class="map-toggle-row">
                        <input type="checkbox" id="mapJobBoardToggle" checked>
                        <span>🧾 Job Board</span>
                    </label>
                </div>
                <h2>Governments</h2>
                <div id="mapLegendList"></div>
            </div>

            <div class="map-tooltip" id="mapTooltip"></div>

            <div class="map-controls">
                <button id="mapZoomIn"  title="Zoom in">+</button>
                <button id="mapZoomOut" title="Zoom out">–</button>
                <button id="mapReset"   title="Reset view">⟲</button>
            </div>

            <div class="map-hint">scroll / pinch to zoom · drag to pan · tap or click a system</div>

            <div class="map-loading" id="mapLoading">
                <span>Fetching system data…</span>
                <div class="map-loading-track"><div class="map-loading-bar" id="mapLoadingBar"></div></div>
            </div>
        </div>

        <!-- Details panel: click a system to fill this in, click a planet in the
             list to drill in further. Always here, never a popup — an accidental
             click just replaces its contents, nothing to dismiss or get stuck in. -->
        <div class="panel map-details-panel" id="mapDetailsPanel" style="margin-top:16px;">
            <div class="map-details-empty">Click or tap a system on the map to see its details here.</div>
        </div>

    </div>

    <!-- ── Shared, sitewide plugin selection (unchanged — reused as-is) ── -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../JavaScript/supabaseClient.js"></script>
    <script src="../JavaScript/auth.js"></script>
    <script src="../JavaScript/esCache.js"></script>
    <script src="../JavaScript/dataLoader.js"></script>
    <script src="../JavaScript/gameKeys.js"></script>
    <script src="../JavaScript/generalPluginStuff.js"></script>
    <script src="../JavaScript/Animator.js"></script>
    <script src="../JavaScript/ImageGrabber.js"></script>

    <!-- ── Map pipeline: grab → format → calculate → display ───────────── -->
    <script src="../JavaScript/mapDataLoader.js"></script>
    <script src="../JavaScript/mapDataFormatter.js"></script>
    <script src="../JavaScript/mapCalculations.js"></script>
    <script src="../JavaScript/esSaveFile.js"></script>
    <script src="../JavaScript/saveVault.js"></script>
    <script src="../JavaScript/mapSaveState.js"></script>
    <script src="../JavaScript/mapTradeHelper.js"></script>
    <script src="../JavaScript/mapTimeline.js"></script>
    <script src="../JavaScript/shareLinks.js"></script>
    <script src="../JavaScript/mapDisplay.js"></script>

</body>
</html>
