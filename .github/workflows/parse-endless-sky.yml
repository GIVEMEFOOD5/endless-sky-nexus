name: Parse Endless Sky Data

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Push everything again, ignoring the cache of the last run'
        type: boolean
        default: false
  push:
    paths:
      - 'plugins.json'

concurrency:
  group: parse-job
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            plugins.json
            parser.js
            Display/JavaScript/pluginRefs.js
            speciesResolver.js
            locationResolver.js
            attributeParser.js
            data/
            parse-status.json
            build/
            supabase/migrations/
            Display/JavaScript/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Make sure the database is set up
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          npm install --no-save --no-package-lock pg@8
          node build/dbHealth.mjs

      - name: Install parser dependencies
        run: npm install adm-zip tar @supabase/supabase-js --prefix /tmp/parser-deps --no-save

      - name: Clear existing data folder
        run: |
          git rm -r --cached data/ --quiet || true
          rm -rf data/

      # What the last successful run pushed (see pushCache.js), so this run
      # only sends changes. Restores the newest saved cache.
      - name: Restore parse cache
        uses: actions/cache/restore@v4
        with:
          path: .parse-cache
          key: parse-cache-${{ github.run_id }}
          restore-keys: parse-cache-

      - name: Run parser
        env:
          PARSE_FULL: ${{ inputs.full_refresh && '1' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_PATH: /tmp/parser-deps/node_modules
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node parser.js

      - name: Save parse cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .parse-cache
          key: parse-cache-${{ github.run_id }}

      - name: Commit parsed data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Update Endless Sky data - $(date +'%Y-%m-%d')"
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          else
            echo "No changes to commit"
          fi

      - name: Mark parse as complete
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin main
          git rebase -X theirs origin/main
          echo '{"status":"idle","completedAt":"'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}' > parse-status.json
          git add parse-status.json
          git diff --staged --quiet || (
            git commit -m "chore: mark parse as complete" &&
            git push
          )