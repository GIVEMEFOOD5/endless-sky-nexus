# Keeps the database set up: checks that every table/view/function the website uses exists and is
# allowed, and fixes it (supabase/migrations + permissions from the row rules) when it isn't.
name: Database health

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'build/dbHealth.mjs', '.github/workflows/database.yml']
  schedule:
    - cron: '30 5 * * *'           # every day
  workflow_run:                     # when the site checks fail, see if the database is the cause
    workflows: ['Site checks']
    types: [completed]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Run every setup script even if nothing looks wrong'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write                    # to re-run the site checks after a fix

concurrency:
  group: database-health
  cancel-in-progress: false

jobs:
  health:
    # after Site checks only when they failed
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Display/JavaScript
            build
            supabase
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-save --no-package-lock pg@8

      - name: Check and fix the database
        id: health
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node build/dbHealth.mjs ${{ inputs.apply && '--apply' || '' }} | tee health.log
          if grep -q "Fixing:" health.log; then echo "fixed=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Re-run the site checks after a fix
        if: steps.health.outputs.fixed == 'yes' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-checks.yml --repo "${{ github.repository }}"
